<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">

<head>
  <meta charset="UTF-8">
  <link href="src/styles.css" rel="stylesheet">
  <style>
    body {
      width: 330px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
    }
  </style>
</head>

<body class="p-3.5 bg-slate-900 text-xs space-y-3 select-none">
  <!-- Header & Toggle Switch -->
  <div class="flex items-center justify-between pb-2.5 border-b border-slate-800">
    <div class="flex items-center space-x-2 font-semibold text-slate-200">
      <span class="text-red-500 font-bold">YT Sub TTS</span>
    </div>
    <label class="relative inline-flex w-11 h-5 items-center cursor-pointer">
      <input type="checkbox" id="toggle-enable" checked class="peer appearance-none w-11 h-5 bg-slate-100 rounded-full checked:bg-red-600 cursor-pointer transition-colors duration-300">
      <label for="toggle-enable" class="absolute top-0 left-0 w-5 h-5 bg-white rounded-full border border-slate-300 shadow-sm transition-transform duration-300 peer-checked:translate-x-6 peer-checked:border-red-600 cursor-pointer">
      </div>
    </label>
  </div>

  <!-- Engine Type Select -->
  <div>
    <label class="block text-slate-400 mb-1 font-medium">Chế độ TTS Engine</label>
    <select id="select-engine"
      class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-red-500 font-medium">
      <option value="webspeech">🌐 Web Speech API (Windows)</option>
      <option value="localserver">🖥️ Local TTS Server (WebSocket)</option>
    </select>
  </div>

  <!-- Local Server Endpoint -->
  <div id="box-localserver" class="p-2 bg-slate-950 border border-slate-800 rounded space-y-1">
    <div class="flex justify-between items-center">
      <label class="block text-slate-400 font-medium text-[11px]">Server URL (WebSocket)</label>
      
      <!-- Đèn báo trạng thái động -->
      <span id="ws-status-badge" class="inline-flex items-center text-[10px] text-slate-400 bg-slate-900 border border-slate-800 px-1.5 py-0.5 rounded transition-all">
        <span id="ws-status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1"></span>
        <span id="ws-status-text">Connecting...</span>
      </span>
    </div>
    <input type="text" id="input-serverurl" value="ws://127.0.0.1:8000/ws/tts" placeholder="ws://127.0.0.1:8000/ws/tts"
      class="w-full bg-slate-900 border border-slate-700 text-amber-300 rounded px-2 py-1 text-xs font-mono">
  </div>

  <!-- Select WebSpeech Voice -->
  <div id="box-webspeech" class="hidden">
    <label class="block text-slate-400 mb-1 font-medium">Giọng đọc Hệ điều hành</label>
    <div class="field">
      <label for="select-lang">Ngôn ngữ:</label>
      <select id="select-lang"
        class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-red-500"></select></select>
    </div>
  </div>
  <!-- Voice Selection -->
  <div class="space-y-1">
    <label class="block text-slate-400 font-medium text-[11px]">Giọng đọc (Voice)</label>
    <select id="select-voice" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-amber-500">
      <!-- JS sẽ tự động inject danh sách Voice theo Engine được chọn -->
    </select>
  </div>

  <!-- Speed & Pitch Sliders -->
  <div class="grid grid-cols-2 gap-2">
    <div>
      <div class="flex justify-between text-slate-400 mb-0.5">
        <span>Tốc độ</span>
        <span id="rate-label" class="text-red-400">1.0x</span>
      </div>
      <input type="range" id="input-rate" min="0.5" max="2.5" step="0.1" value="1.0"
        class="w-full accent-red-500 h-1 bg-slate-800 rounded">
    </div>
    <div>
      <div class="flex justify-between text-slate-400 mb-0.5">
        <span>Cao độ</span>
        <span id="pitch-label" class="text-red-400">1.0</span>
      </div>
      <input type="range" id="input-pitch" min="0.5" max="1.5" step="0.1" value="1.0"
        class="w-full accent-red-500 h-1 bg-slate-800 rounded">
    </div>
  </div>

  <!-- Audio Ducking Settings -->
  <div class="pt-2 border-t border-slate-800/80">
    <div class="flex items-center justify-between mb-1">
      <span class="text-slate-400 font-medium">Giảm tiếng Video khi đọc:</span>
      <span id="ducking-label" class="text-slate-300 font-mono">20%</span>
    </div>
    <input type="range" id="input-ducking" min="0" max="100" step="5" value="20"
      class="w-full accent-blue-500 h-1 bg-slate-800 rounded">
  </div>

  <script src="src/popup.js"></script>
</body>

</html>
